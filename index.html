/* Layout: editorial one-column rhythm with a two-column hero and a two-column configurator (steps left, live summary right). Quiet palette, mauve and sand only as accents, olive marks availability and selection. */
:root{
  --bg:#EAE4DE; --surface:#FAF8F5; --surface2:#F2EDE7; --line:#D9D3CE;
  --fg:#443F3D; --muted:#5E5A56; --ink:#53504C; --ink-on:#FAF8F5;
  --mauve:#9C8277; --sand:#BBA595; --olive:#8B8F6B; --olive-ink:#5F6347; --bad:#A5473A;

}
@media (prefers-color-scheme: dark){

    --mauve:#BBA595; --sand:#B5A89D; --olive:#A3A77F; --olive-ink:#C3C79E; --bad:#F6BDB1;
    --leaf-a:#BBA595; --leaf-b:#EAE4DE; --ph1:#53504C; --ph2:#706E6A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#443F3D; --surface:#53504C; --surface2:#4D4947; --line:#706E6A;
  --fg:#FAF8F5; --muted:#D9D3CE; --ink:#EAE4DE; --ink-on:#443F3D;
  --mauve:#BBA595; --sand:#B5A89D; --olive:#A3A77F; --olive-ink:#C3C79E; --bad:#F6BDB1;
  --leaf-a:#BBA595; --leaf-b:#EAE4DE; --ph1:#53504C; --ph2:#706E6A; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}

:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* photo slots */
.ph{position:relative;width:100%;max-width:100%;background:linear-gradient(135deg,var(--ph1),var(--ph2));border-radius:var(--r);overflow:hidden;display:flex;align-items:flex-end}

.r45{aspect-ratio:4/5}.r43{aspect-ratio:4/3}.r32{aspect-ratio:3/2}

.quote{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:14px;min-width:0}

@media (max-width:700px){.pkgs{grid-template-columns:1fr}}
.opt{position:relative;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;min-width:0}

}

.check{display:flex;gap:10px;align-items:flex-start;font-size:.85rem;color:var(--muted)}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--ink)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.done{background:var(--surface);border:1px solid var(--fg);border-radius:var(--r);padding:clamp(20px,4vw,32px);display:flex;flex-direction:column;gap:16px}
.done h3{font-size:1.2rem}
.done .id{font-family:var(--display);font-weight:600;letter-spacing:.12em}
.demo-note{border:1px dashed var(--mauve);padding:10px 12px;font-size:.85rem;border-radius:2px;color:var(--muted)}
.sumtxt{white-space:pre-wrap;font-family:var(--body);font-size:.85rem;color:var(--muted);background:var(--surface2);padding:12px;border-radius:2px;margin:0;overflow-wrap:anywhere}

/* plans, process, faq */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:860px){.plans{grid-template-columns:1fr}}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.plan.best{border-color:var(--fg)}
.plan ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:.9rem;color:var(--muted);flex:1}
.plan li{display:flex;gap:8px}
.plan li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--olive);margin-top:.6em}
.plan .pr{font-family:var(--display);font-weight:600;font-size:1.3rem;font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.plan .pr small{font-size:.74rem;font-weight:500;color:var(--muted)}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;list-style:none;margin:0;padding:0;counter-reset:s}
@media (max-width:860px){.steps4{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.steps4{grid-template-columns:1fr}}
.steps4 li{counter-increment:s;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--mauve);padding-top:14px}
.steps4 li::before{content:counter(s);font-family:var(--display);font-weight:300;font-size:1.8rem;color:var(--mauve);line-height:1}
.steps4 p{font-size:.9rem;color:var(--muted)}
.opform{max-width:720px;display:flex;flex-direction:column;gap:16px}
.batabs:empty{display:none}
.batabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.batabs button{font:500 .8rem var(--body);padding:10px 14px;min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r);cursor:pointer}
.batabs button[aria-pressed=true]{background:var(--ink);color:var(--ink-on);border-color:var(--ink)}
.ba{aspect-ratio:3/2;max-width:900px;margin-top:16px}
.ba .l{position:absolute;bottom:10px;background:var(--surface);color:var(--fg);font-size:.72rem;padding:5px 10px;border-radius:2px;pointer-events:none}
.ba .l1{left:10px}.ba .l2{right:10px}
.ba .ba-top{position:absolute;inset:0;clip-path:inset(0 0 0 var(--p,50%))}
.ba .ba-bar{position:absolute;top:0;bottom:0;left:var(--p,50%);width:2px;background:var(--surface);pointer-events:none}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:ew-resize;touch-action:pan-y}

/* header que se oculta al bajar (celular) */
.top{transition:transform .25s ease}
.top.hide{transform:translateY(-100%)}
section[id]{scroll-margin-top:72px}
/* paquete recomendado */
.pkgs{padding-top:10px}
.opt .rec{position:absolute;top:-10px;right:12px;background:var(--ink);color:var(--ink-on);font:600 .6rem var(--display);letter-spacing:.14em;text-transform:uppercase;padding:4px 8px;border-radius:2px;pointer-events:none}
/* confianza junto al total */
.trust{list-style:none;margin:0;padding:14px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;font-size:.84rem}
.trust li{display:flex;gap:8px;align-items:flex-start}
.trust li::before{content:"\2713";color:var(--olive-ink);font-weight:600;flex:none}
.sum .tq{margin:0;font-size:.84rem;color:var(--muted);font-style:italic}
.sum .tq b{display:block;font-style:normal;font-weight:500;color:var(--fg);margin-top:4px;font-size:.78rem}
.clients{margin-top:16px;font-size:.84rem;color:var(--muted)}
.clients b{color:var(--fg);font-weight:500}
/* visor de fotos */
.case .ph.has-img{cursor:zoom-in}
.lb{padding:0;border:0;background:transparent;width:100vw;height:100dvh;max-width:100vw;max-height:100dvh;margin:0;inset:0}
.lb[open]{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.lb::backdrop{background:rgba(20,18,17,.97)}
.lb img{max-width:calc(100vw - 32px);max-height:calc(100dvh - 130px);object-fit:contain;border-radius:2px}
.lb p{color:#F2EDE7;font-size:.85rem;margin:0;padding-inline:16px;text-align:center;max-width:60ch}
.lb button{position:absolute;width:48px;height:48px;border-radius:50%;border:1px solid rgba(242,237,231,.45);background:rgba(20,18,17,.6);color:#F2EDE7;font-size:1.5rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lb button[hidden]{display:none}
.lb-x{top:max(12px,env(safe-area-inset-top,0px));right:12px}
.lb-p{left:12px;top:50%;transform:translateY(-50%)}
.lb-n{right:12px;top:50%;transform:translateY(-50%)}
@media (max-width:860px){
  .top .bar{padding-block:8px}
  .navstrip div{padding-block:8px}
}
.faq{max-width:780px;display:flex;flex-direction:column}
.faq details{border-top:1px solid var(--line);padding-block:4px}
.faq details:last-child{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;font-family:var(--display);font-weight:500;font-size:.98rem;padding-block:16px;display:flex;justify-content:space-between;gap:16px;align-items:center;min-height:48px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-weight:300;font-size:1.4rem;color:var(--mauve);flex:none}
.faq details[open] summary::after{content:"\2212"}
.faq details p{padding-bottom:18px;color:var(--muted);font-size:.95rem;max-width:64ch}

/* contact + footer */
.contact{background:var(--surface2);border-block:1px solid var(--line)}
.contact .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(24px,5vw,64px);align-items:center}
@media (max-width:860px){.contact .grid{grid-template-columns:1fr}}
.links{display:flex;flex-direction:column;gap:10px}
.links a.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-block:14px;text-decoration:none;font-size:.95rem}
.links a.row span{color:var(--muted)}
footer{padding-block:40px calc(40px + 72px)}
footer .wrap{display:flex;gap:24px;flex-wrap:wrap;align-items:center;justify-content:space-between}
footer .lock{display:flex;align-items:center;gap:16px}
footer .lock .t{display:flex;flex-direction:column;font-family:var(--display);letter-spacing:.3em;text-transform:uppercase;font-size:.9rem;line-height:1.5}
footer .lock .t small{font-size:.6rem;letter-spacing:.24em;color:var(--muted)}
/* floating whatsapp */
.wa{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:var(--ink-on);border:0;border-radius:999px;padding:0 20px;min-height:52px;font-family:var(--display);font-weight:600;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,.22);transition:bottom .2s}
.wa svg{width:20px;height:20px;fill:currentColor}
.wa.lift{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:.85rem;z-index:40;max-width:calc(100% - 32px);text-align:center}

/* ---- patch7: lectura en celular, toques de 44 px, aparición al bajar ---- */
.btn{font-size:.8rem;min-height:48px}
.btn.small{font-size:.74rem;min-height:44px}
.eyebrow{font-size:.76rem}
.lang button{min-height:44px;min-width:44px;font-size:.76rem}
@media (max-width:860px){
  .navstrip div{gap:4px;font-size:.76rem;padding-block:0}
  .navstrip a{display:inline-flex;align-items:center;min-height:44px;padding-inline:9px}
}
.chip{font-size:.76rem}
.lb-cap-n{opacity:.7;margin-left:.6em;font-variant-numeric:tabular-nums}
.nights{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.nights label{font-size:.84rem;font-weight:500}
.nights .nt-row{display:flex;align-items:center;gap:8px}
.nights .nt-row span{font-size:.84rem;color:var(--muted)}
.nights input{max-width:140px}
.nights #nt-out{margin:0}
.nights #nt-out b{color:var(--fg);font-weight:600}
@keyframes sc-rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes sc-zoom{from{transform:scale(1)}to{transform:scale(1.07)}}
@supports (animation-timeline: view()){
  @media (prefers-reduced-motion: no-preference){
    .sec-head,.cards4>*,.work>*,.quotes>*,.plans>*,.steps4>li,.faq>*{animation:sc-rise linear both;animation-timeline:view();animation-range:entry 0% entry 40%}
    .hero .ph img{animation:sc-zoom linear both;animation-timeline:scroll(root);animation-range:0 90vh}
  }
}

/* ---- patch8: en celular la foto va primero, de borde a borde ---- */
@media (max-width:860px){
  .hero{padding-top:0}
  .hero .ph{order:-1;width:auto;max-width:none;margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));border-radius:0}
  .hero .grid{gap:24px}
}

/* ---- patch9: título de portada más contenido en compu, para ver los botones sin bajar ---- */
@media (min-width:861px){.hero h1{font-size:clamp(2.4rem,3.6vw,3.1rem)}}

/* ---- patch10: jerarquía de títulos, texto más legible, portafolio deslizable en celular ---- */
h2{font-weight:300;font-size:clamp(1.65rem,3.6vw,2.6rem);line-height:1.18;letter-spacing:-.005em;text-transform:none}
.sec-head h2::after{content:none}
.sec-head{gap:12px}
.sec-head .eyebrow{display:flex;align-items:center;gap:12px}
.sec-head .eyebrow::before{content:"";width:28px;height:1px;background:var(--mauve)}
.svc p,.steps4 p,.faq details p{font-size:1rem}
.plan ul{font-size:.95rem}
.case p.small{font-size:.95rem}
.calc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-top:32px;max-width:720px;border-top:1px solid var(--line)}
.calc h3{font-size:1.05rem}
.nt-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.nt-list li{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;font-size:.9rem;color:var(--muted)}
.nt-list li b{font-family:var(--display);font-size:1.35rem;font-weight:500;color:var(--fg);font-variant-numeric:tabular-nums}
.nt-list li.hint{grid-column:1/-1}
@media (max-width:520px){.nt-list{grid-template-columns:1fr}}
@media (max-width:860px){.hero .r45{aspect-ratio:3/2}}
@media (max-width:700px){
  .work{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:14px;margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));padding:0 max(16px, env(safe-area-inset-left, 0px)) 10px;scroll-padding-inline:max(16px, env(safe-area-inset-left, 0px));scrollbar-width:none;overscroll-behavior-x:contain}
  .work::-webkit-scrollbar{display:none}
  .work>.case{flex:0 0 84%;scroll-snap-align:start;animation:none !important}
}

/* ---- patch11: en celular, los botones de la portada entran en la primera pantalla ---- */
@media (max-width:520px){
  .hero .grid{gap:18px}
  .hero .copy{gap:14px}
  .hero h1{font-size:1.85rem}
  .hero .lead{font-size:1rem}
}

.brand{min-height:44px;display:inline-flex;align-items:center}
.nav a{display:inline-flex;align-items:center;min-height:44px}

/* ---- patch12: frase de marca tras la portada, video de portada opcional ---- */
.manifesto{padding-block:clamp(44px,7vw,88px);border-bottom:1px solid var(--line)}
.manifesto .eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.manifesto .eyebrow::before{content:"";width:28px;height:1px;background:var(--mauve)}
.manifesto p{font-family:var(--display);font-weight:300;font-size:clamp(1.45rem,3.4vw,2.35rem);line-height:1.3;letter-spacing:-.005em;max-width:30ch;margin:0;color:var(--fg)}
.manifesto p em{font-style:normal;font-weight:500}
.ph video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@supports (animation-timeline: view()){
  @media (prefers-reduced-motion: no-preference){
    .manifesto p{animation:sc-rise linear both;animation-timeline:view();animation-range:entry 0% entry 45%}
  }
}

/* ---- patch15: el video de portada aparece con fundido sobre la foto ---- */
.ph video{opacity:0;transition:opacity .9s ease}
.ph video.on{opacity:1}

/* ---- patch16: WhatsApp flotante discreto, oculto sobre la portada; solo ícono en celular ---- */
.wa{transition:bottom .2s,opacity .25s,transform .25s}
.wa.away{opacity:0;transform:translateY(14px);pointer-events:none}
@media (max-width:700px){
  .wa{padding:0;width:56px;min-height:56px;justify-content:center}
  .wa span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .wa svg{width:26px;height:26px}
}

/* ---- patch17: portada más compacta en celular ---- */
@media (max-width:520px){
  .hero .facts{grid-template-columns:repeat(3,1fr);gap:10px}
  .hero .facts span{font-size:.78rem}
  .hero .acts .btn{flex:1 1 100%;justify-content:center}
}

/* ---- patch18: verde oliva como color de marca: disponibles, botones, títulos, preguntas; rojo para ocupadas ---- */
:root{--olive-deep:#555A3F; --btn:#555A3F; --btn-fg:#FAF8F5; --free-bg:#E1E3CF; --free-bd:#8B8F6B; --busy-bg:#F3DDD7; --busy-fg:#9A3F33; --busy-bd:#D9A89F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--btn:#6B7150; --free-bg:#4F5339; --free-bd:#A3A77F; --busy-bg:#5C3F3A; --busy-fg:#F6BDB1; --busy-bd:#9C6A62}}
:root[data-theme="dark"]{--btn:#6B7150; --free-bg:#4F5339; --free-bd:#A3A77F; --busy-bg:#5C3F3A; --busy-fg:#F6BDB1; --busy-bd:#9C6A62}
/* botones */
.btn{background:var(--btn);border-color:var(--btn);color:var(--btn-fg)}
.btn.small{color:var(--btn-fg)}
.btn.ghost,.btn.ghost.small{background:transparent;color:var(--olive-ink);border-color:var(--olive-ink)}
.btn.ghost:hover{background:var(--olive-ink);color:var(--surface);filter:none}
/* títulos */
h2{color:var(--olive-ink)}
.sec-head h2::after{background:var(--olive)}
.eyebrow::before{background:var(--olive)}
.steps4 li::before{color:var(--olive)}
.opt.on{border-color:var(--olive-ink);box-shadow:inset 0 0 0 1px var(--olive-ink)}
/* calendario: verde = disponible, rojo = ocupada */
.day.free{background:var(--free-bg);border-color:var(--free-bd)}
.day.free::after{display:none}
.day.free:hover{background:var(--free-bd);color:var(--surface)}
.day.busy{background:var(--busy-bg);border-color:var(--busy-bd);color:var(--busy-fg);opacity:1;text-decoration:line-through}
.day.off{opacity:.4}
.day.sel,.day.sel:hover{background:var(--btn);color:var(--btn-fg);border-color:var(--btn);text-decoration:none}
.legend i{width:12px;height:12px;border-radius:3px;background:var(--free-bg);border:1px solid var(--free-bd)}
.legend i.x{background:var(--busy-bg);border-color:var(--busy-bd)}
.legend i.s{background:var(--btn);border-color:var(--btn)}
/* preguntas: fondo verde oliva, letras crema */
#faq{background:var(--olive-deep);color:#FAF8F5;border-block:1px solid #444830}
#faq h2,#faq .eyebrow{color:#FAF8F5}
#faq .sec-head h2::after,#faq .eyebrow::before{background:#E3D3C4}
#faq .faq details{border-color:rgba(250,248,245,.28)}
#faq .faq summary{color:#FAF8F5}
#faq .faq summary::after{color:#E3D3C4}
#faq .faq details p{color:#EAE4DE}
#faq a{color:#FAF8F5}
#faq :focus-visible{outline-color:#FAF8F5}
.wa{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.day.sel{font-weight:700;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--btn)}
/* patch19: sección "Cómo funciona" en verde oliva, igual que preguntas */
#proceso{background:var(--olive-deep)!important;color:#FAF8F5;border-block:1px solid #444830!important}
#proceso h2,#proceso .eyebrow,#proceso h3{color:#FAF8F5}
#proceso .sec-head h2::after,#proceso .eyebrow::before{background:#E3D3C4}
#proceso .lead,#proceso p,#proceso .steps4 p{color:#EAE4DE}
#proceso .steps4 li{border-top-color:rgba(250,248,245,.45)}
#proceso .steps4 li::before{color:#E3D3C4}
#proceso :focus-visible{outline-color:#FAF8F5}

  function validate() {
    var bad = null;
    function chk(ok, errId, key, fieldId) { setErr(errId, ok ? "" : t(key)); if (!ok && !bad) bad = fieldId; }
    chk(val("f-name").length >= 2, "e-name", "e.name", "f-name");
    var digits = val("f-phone").replace(/\D/g, "");
    chk(digits.length >= 8 && digits.length <= 15, "e-phone", "e.phone", "f-phone");
    var em = val("f-email");
    chk(!em || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em), "e-email", "e.email", "f-email");
    chk(val("f-property").length >= 3, "e-property", "e.prop", "f-property");
    chk($("f-consent").checked, "e-consent", "e.consent", "f-consent");
    var dateOk = !!S.date && !isBusy(S.date);
    setErr("e-date", dateOk ? "" : t("e.date"));
    if (!dateOk) { toast(t("e.date")); if (!bad) bad = "cal"; }
    return bad;
  }
  function newId() {
    var d = new Date(), yy = String(d.getFullYear()).slice(2), mm = ("0" + (d.getMonth() + 1)).slice(-2), dd = ("0" + d.getDate()).slice(-2);
    var r = Math.floor(Math.random() * 1679616).toString(36).toUpperCase(); while (r.length < 4) r = "0" + r;
    return "SC-" + yy + mm + dd + "-" + r;
  }
  function buildPayload(c) {
    return { id: newId(), createdAt: new Date().toISOString(), lang: lang, name: val("f-name"), company: val("f-company"), phone: val("f-phone"), email: val("f-email"), property: val("f-property"), notes: val("f-notes"),
      date: S.date, slot: S.slot, pkg: S.pkg, props: S.props, drone: S.drone, editorial: S.editorial, beach: S.beach, photos: S.photos, staging: S.staging, retouch: S.retouch, zone: S.zone,
      totalCRC: c.total, travelQuote: c.quote, example: CONFIG.exampleMode, iva: CONFIG.ivaMode };
  }
  function summaryText(p, c) {
    var d = D(), ex = [];
    if (p.editorial) ex.push(d.extras.editorial.t);
    if (p.beach) ex.push(D().extras.beach.t);
    if (p.photos) ex.push(p.photos + " × " + d.extras.photos.t);
    if (p.staging) ex.push(p.staging + " × " + d.extras.staging.t);
    if (p.retouch) ex.push(p.retouch + " × " + d.extras.retouch.t);
    var L = [t("msg.hi", { n: p.name, id: p.id }), t("msg.prop", { p: p.property }), t("msg.when", { d: longDate(p.date), s: t("slot." + p.slot).split(" (")[0] }), t("msg.pkg", { p: d.pk[p.pkg].n, n: p.props })];
    if (p.drone !== "none") L.push(t("msg.drone", { o: t("drone." + p.drone) }));
    if (ex.length) L.push(t("msg.extras", { e: ex.join(", ") + " (" + t("line.perprop") + ")" }));
    L.push(t("msg.zone", { z: d.zones[p.zone] + (c.quote ? " (" + t("zone.quote") + ")" : "") }));
    L.push(t("msg.total", { t: fmt(c.total), ex: CONFIG.exampleMode ? t("msg.ex") : "" }));
    return L.join("\n");
  }
  var lastResult = null;
  function showResult(kind, p, c) {
    lastResult = { kind: kind, p: p, c: c };
    var box = $("result"); box.innerHTML = "";
    var card = document.createElement("div"); card.className = "done";
    var h = document.createElement("h3"); h.textContent = t("res.title"); card.appendChild(h);
    var st = document.createElement("p");
    if (kind === "demo") { st.className = "demo-note"; st.textContent = t("res.demo"); }
    else if (kind === "ok") { st.textContent = t("res.ok"); }
    else { st.className = "err"; st.textContent = t("e.send"); }
    card.appendChild(st);
    var idp = document.createElement("p"); idp.className = "small"; idp.innerHTML = t("res.id") + ': <span class="id"></span>'; idp.querySelector(".id").textContent = p.id; card.appendChild(idp);
    var pre = document.createElement("pre"); pre.className = "sumtxt"; pre.textContent = summaryText(p, c); card.appendChild(pre);
    var row = document.createElement("div"); row.style.cssText = "display:flex;gap:12px;flex-wrap:wrap";
    var wa = document.createElement("a"); wa.className = "btn"; wa.textContent = t("res.wa"); bindWa(wa, summaryText(p, c)); row.appendChild(wa);
    var again = document.createElement("button"); again.type = "button"; again.className = "btn ghost"; again.textContent = t("res.again");
    again.addEventListener("click", function () { box.hidden = true; $("reservar").hidden = false; $("stickybar").hidden = false; lastResult = null; $("reservar").scrollIntoView({ block: "start" }); });
    row.appendChild(again); card.appendChild(row); box.appendChild(card);
    $("reservar").hidden = true; $("stickybar").hidden = true; box.hidden = false; box.scrollIntoView({ block: "start" });
  }
  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    if ($("f-web").value) return; /* trampa para bots */
    var bad = validate();
    if (bad) { var el = bad === "cal" ? $("s3") : $(bad); if (el) { el.scrollIntoView({ block: "center" }); if (el.focus && bad !== "cal") el.focus(); } return; }
    var c = calc(), p = buildPayload(c);
    if (!CONFIG.endpoint) { showResult("demo", p, c); return; }
    var btn = $("submit"); btn.disabled = true; setErr("e-form", "");
    fetch(CONFIG.endpoint, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(p) })
      .then(function (r) { return r.json(); })
      .then(function (j) { btn.disabled = false; if (j && j.ok) showResult("ok", p, c); else showResult("fail", p, c); })
      .catch(function () { btn.disabled = false; showResult("fail", p, c); });
  });

  /* ---------- controles ---------- */
  $("p-minus").addEventListener("click", function () { S.props = Math.max(1, S.props - 1); renderSum(); });
  $("p-plus").addEventListener("click", function () { S.props = Math.min(CONFIG.maxProps, S.props + 1); renderSum(); });
  $("f-rate").addEventListener("input", function () { renderNights(calc()); });
  $("zone").addEventListener("change", function () { S.zone = this.value; $("zone-note").textContent = S.zone === "other" ? t("zone.other") : ""; renderSum(); });
  $("bar-next").addEventListener("click", function () {
    var target = S.date ? $("s4") : $("s3"); target.scrollIntoView({ block: "start" });
    if (S.date) { var f = $("f-name"); if (!val("f-name")) f.focus(); }
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-lang]"), function (b) { b.addEventListener("click", function () { setLang(b.dataset.lang); }); });
  Array.prototype.forEach.call(document.querySelectorAll("[data-wa]"), function (a) { bindWa(a, t("wa.generic")); });

  /* ---------- idioma ---------- */
  function setLang(l) {
    lang = l; try { localStorage.setItem("sc-lang", l); } catch (e) {}
    document.documentElement.lang = l;
    document.title = t("meta.title");
    var md = document.querySelector('meta[name="description"]'); if (md) md.setAttribute("content", t("meta.desc"));
    var ot = document.querySelector('meta[property="og:title"]'); if (ot) ot.setAttribute("content", t("meta.title"));
    var od = document.querySelector('meta[property="og:description"]'); if (od) od.setAttribute("content", t("meta.desc"));
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (el) { el.textContent = t(el.getAttribute("data-i18n")); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-ph]"), function (el) { el.setAttribute("placeholder", t(el.getAttribute("data-i18n-ph"))); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-lang]"), function (b) { b.setAttribute("aria-pressed", String(b.dataset.lang === l)); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-wa]"), function (a) { bindWa(a, t("wa.generic")); });
    $("ribbon").hidden = !CONFIG.exampleMode; $("exbanner").hidden = !CONFIG.exampleMode; $("sum-ex").hidden = !CONFIG.exampleMode;
    renderStatic(); renderPkgs(); renderDrone(); renderExtras(); renderZone(); renderSlots(); renderCal(); renderSum();
    if (lastResult) showResult(lastResult.kind, lastResult.p, lastResult.c);
  }

  /* ocultar el botón flotante de WhatsApp mientras se ve la portada (ya tiene sus botones) */
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (en) { $("wa-float").classList.toggle("away", en[0].isIntersecting); }, { threshold: 0.25 }).observe($("inicio"));
  }
  /* subir el botón de WhatsApp cuando aparece la barra fija del total */
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (en) {
      var on = en[0].isIntersecting && window.matchMedia("(max-width:980px)").matches && !$("stickybar").hidden;
      $("wa-float").classList.toggle("lift", on);
    }, { threshold: 0 }).observe($("reservar"));
  }

  var opf = $("opform");
  if (opf) opf.addEventListener("submit", function (e) {
    e.preventDefault();
    var n = parseInt($("op-n").value, 10), er = $("op-e");
    if (!(n >= 1 && n <= 500)) { er.textContent = t("op.bad"); er.hidden = false; $("op-n").focus(); return; }
    er.hidden = true;
    var w = $("op-w"), z = $("op-z").value.trim() || "___";
    var text = t("op.msg", { n: n, z: z, w: w.options[w.selectedIndex].textContent });
    if (!waReady()) { toast(t("wa.nonum")); return; }
    window.open(waHref(text), "_blank", "noopener");
  });

  /* ---------- encabezado que se oculta al bajar (celular) ---------- */
  (function () {
    var hd = document.querySelector("header.top"), last = window.scrollY, mq = window.matchMedia("(max-width:860px)");
    window.addEventListener("scroll", function () {
      var y = window.scrollY;
      if (!mq.matches || y < 80) { hd.classList.remove("hide"); last = y; return; }
      if (Math.abs(y - last) < 8) return;
      hd.classList.toggle("hide", y > last); last = y;
    }, { passive: true });
    hd.addEventListener("focusin", function () { hd.classList.remove("hide"); });
  })();

  /* ---------- visor de fotos ---------- */
  var lbItems = [], lbI = 0;
  function showLb() {
    var el = lbItems[lbI], img = el.querySelector("img");
    $("lb-img").src = img.src; $("lb-img").alt = el.dataset.alt; var multi = lbItems.length > 1;
    $("lb-cap").innerHTML = ""; $("lb-cap").appendChild(document.createTextNode(el.dataset.alt));
    if (multi) { var n = document.createElement("span"); n.className = "lb-cap-n"; n.textContent = (lbI + 1) + " / " + lbItems.length; $("lb-cap").appendChild(n); } $("lb-p").hidden = !multi; $("lb-n").hidden = !multi;
  }
  function openLb(items, i) {
    lbItems = items; lbI = i; var d = $("lb");
    $("lb-x").setAttribute("aria-label", t("lb.close")); $("lb-p").setAttribute("aria-label", t("lb.prev")); $("lb-n").setAttribute("aria-label", t("lb.next"));
    showLb(); if (d.showModal) d.showModal(); else d.setAttribute("open", "");
  }
  function closeLb() { var d = $("lb"); if (d.close) d.close(); else d.removeAttribute("open"); }
  function stepLb(k) { lbI = (lbI + k + lbItems.length) % lbItems.length; showLb(); }
  function bindZoom() {
    var items = [].slice.call($("work").querySelectorAll(".ph.has-img"));
    items.forEach(function (el, i) {
      el.setAttribute("tabindex", "0"); el.setAttribute("role", "button"); el.setAttribute("aria-label", t("lb.open") + ": " + el.dataset.alt);
      el.onclick = function () { openLb(items, i); };
      el.onkeydown = function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openLb(items, i); } };
    });
  }
  $("lb-x").addEventListener("click", closeLb);
  $("lb-p").addEventListener("click", function () { stepLb(-1); });
  $("lb-n").addEventListener("click", function () { stepLb(1); });
  $("lb").addEventListener("click", function (e) { if (e.target === $("lb")) closeLb(); });
  (function () { var x0 = null, y0 = 0;
    $("lb").addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
    $("lb").addEventListener("touchend", function (e) { if (x0 === null || lbItems.length < 2) return; var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null; if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) stepLb(dx < 0 ? 1 : -1); }, { passive: true });
  })();
  $("lb").addEventListener("keydown", function (e) { if (e.key === "ArrowLeft") stepLb(-1); if (e.key === "ArrowRight") stepLb(1); });

  setLang(lang);
  loadAvail();
})();

</script>
